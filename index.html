<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Presentación interactiva de escenarios ORHA"><title>ORHA Live Presentation</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><a class="brand" href="#" aria-label="ORHA, inicio"><b>O</b> ORHA</a><div class="live"><i></i> LIVE PRESENTATION</div></header>
<section class="stage" aria-live="polite"><aside class="presenter"><div class="visual" aria-label="Espacio reservado para la presentadora digital"><div class="avatar" aria-hidden="true"><i></i><b></b></div><span>PRESENTADORA DIGITAL</span></div><div class="copy"><p class="eyebrow" id="slide-counter">01 / 06</p><h1 id="slide-title">Panorama del escenario</h1><p id="slide-description">Una vista clara de los indicadores que impulsan el desempeño de ORHA.</p></div></aside>
<section class="data"><div class="scenario-head"><div><p class="eyebrow">ESCENARIO ACTUAL</p><h2 id="scenario-name">Moderado</h2></div><div class="selector" role="group" aria-label="Seleccionar escenario"><button data-scenario="negative">Negativo</button><button data-scenario="moderate" class="active" aria-pressed="true">Moderado</button><button data-scenario="positive">Positivo</button></div></div>
<div class="chart-card"><div class="chart-head"><div><p class="eyebrow">INDICADORES CLAVE</p><h3 id="metric-title">Conversión</h3></div><strong id="metric-value">5.0%</strong></div><div class="chart" id="chart" aria-label="Comparativa por escenario"><div class="grid"></div><div class="bars" id="bars"></div></div></div><div class="metrics" id="metrics-grid"></div></section></section>
<footer><div class="playback"><button class="icon" id="previous" aria-label="Diapositiva anterior">←</button><button class="play" id="play-pause"><span aria-hidden="true">▶</span><span>Iniciar</span></button><button class="icon" id="next" aria-label="Siguiente diapositiva">→</button></div><div class="track" aria-label="Progreso"><span id="progress"></span></div><p id="playback-status">Presentación lista</p></footer></main><script src="app.js"></script></body></html>
